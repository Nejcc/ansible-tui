---
# prod = one shared box plus a dedicated instance per project.
# Selecting this inventory makes the TUI demand a typed confirmation.
all:
  children:
    prod:
      children:
        global_prod:
          hosts:
            www-global-prod:
              ansible_host: 10.0.2.10
              provider: cloud
        dedicated:
          children:
            proj_alpha:
              hosts:
                www-alpha:
                  ansible_host: 10.0.2.21
                  provider: cloud
                  project_php_version: "8.4"
            proj_beta:
              hosts:
                www-beta:
                  ansible_host: 10.0.2.22
                  provider: cloud
                  project_php_version: "8.4"
            proj_gamma:
              hosts:
                www-gamma:
                  ansible_host: 10.0.2.23
                  provider: cloud
                  project_php_version: "8.3"
  vars:
    env: prod
    ansible_connection: local
