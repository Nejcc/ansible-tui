---
# This inventory exists to exercise the typed confirmation, nothing else. It is
# named prod so the guard triggers; every host is still local, so confirming it
# is harmless. Nothing here resolves to a real machine.
all:
  children:
    web:
      hosts:
        web1.prod.sandbox:
          ansible_connection: local
        web2.prod.sandbox:
          ansible_connection: local
        web3.prod.sandbox:
          ansible_connection: local
    db:
      hosts:
        db1.prod.sandbox:
          ansible_connection: local
