all:
  children:
    hypervisors:
      hosts:
        hv-office:
          ansible_host: 10.0.3.7
    master_node:
      # Runs the scheduled jobs and the nightly database sync.
      hosts:
        master-node:
          ansible_host: 10.0.3.57
    local_rds:
      # Local database mirror holding nightly syncs of the production data.
      hosts:
        rds01:
          ansible_host: 10.0.3.79
  vars:
    env: internal
    ansible_connection: local
