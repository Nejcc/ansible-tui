---
# ansible_connection: local means every task runs in this shell. No SSH client
# is started, no key is read, no network socket is opened.
all:
  children:
    web:
      hosts:
        web1.sandbox:
          ansible_connection: local
        web2.sandbox:
          ansible_connection: local
    db:
      hosts:
        db1.sandbox:
          ansible_connection: local
