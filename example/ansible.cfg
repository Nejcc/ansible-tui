# Sandbox configuration. Every play here targets the local machine through the
# local connection plugin, so nothing in this directory can reach a server even
# if it is run by accident.
#
# Deliberately absent: privilege escalation. A real repository usually sets
# become = True, which would make this sandbox prompt for a sudo password and
# then run its tasks as root. Neither belongs in something meant for poking at.
[defaults]
inventory = inventories/dev
host_key_checking = False
retry_files_enabled = False
gathering = explicit
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
