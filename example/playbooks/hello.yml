---
# The quick one. Finishes in a second or two across all hosts and exits 0, so
# the run pane, the recap and the "last: ok" line in the picker all get filled
# in immediately.
- name: Say hello from every host
  hosts: all
  gather_facts: false
  tasks:
    - name: Greet
      ansible.builtin.debug:
        msg: "hello from {{ inventory_hostname }}"

    - name: Report which group this host belongs to
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is in {{ group_names | join(', ') }}"
