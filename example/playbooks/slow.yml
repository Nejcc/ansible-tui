---
# The one to interrupt. Roughly ten seconds of output arriving one line at a
# time, which proves two things at once: output really streams rather than
# appearing all at once at the end, and ctrl+c stops the playbook while leaving
# the interface alive. An interrupted run is recorded with exit 130.
#
# A loop is used rather than a shell loop on purpose. The shell module returns
# its whole output when the task finishes, so a script printing in a loop would
# show nothing until the end — the opposite of what this is meant to demonstrate.
- name: Emit output slowly so streaming and interruption are visible
  hosts: all
  gather_facts: false
  tasks:
    - name: Count to ten, one second at a time
      ansible.builtin.command: sleep 1
      changed_when: false
      loop: "{{ range(1, 11) | list }}"
      loop_control:
        label: "step {{ item }} of 10"
