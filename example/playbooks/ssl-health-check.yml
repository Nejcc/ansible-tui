---
# tui: health
# Fixture: fails deliberately, so the failed badge and the non-zero exit code in
# the history have a source.
- name: Certificate health
  hosts: all
  gather_facts: false
  tasks:
    - name: Inspect
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: reading certificate"

    - name: Expiry within threshold
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }}: certificate expires in 3 days"
